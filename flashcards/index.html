<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2453b8">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<title>Flashcards · profbob.fr</title>
<meta name="description" content="Flashcards des formules à connaître, chapitre par chapitre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/notation.css">
<style>
/* Flashcards : filtres de chapitres, une grande carte qui se retourne, boutons « À revoir » / « Je savais », bilan à la fin */
.bar0{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
.chip{font:inherit;font-family:var(--display);font-size:.86rem;border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--vec);color:var(--vec);font-weight:600}
.chip.alt{margin-left:auto}
.meta2{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.meta2 .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meta2 .track i{display:block;height:100%;background:var(--vec);transition:width .25s}
.stage{perspective:1400px}
.card{position:relative;min-height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.face.back{transform:rotateY(180deg);border-color:var(--vec);background:var(--tint)}
.face .eyebrow{position:absolute;top:18px;left:28px}
.face .q{font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,3.6vw,1.6rem);line-height:1.3;text-align:center}
.face .r{font-family:var(--mono);font-size:clamp(1rem,3vw,1.2rem);line-height:1.8;text-align:center;white-space:pre-line}
.face .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--display);font-size:.78rem;color:var(--muted)}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:16px}
.ctrl button{font:inherit;font-family:var(--display);font-weight:600;font-size:.98rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ctrl .ko{color:var(--bad)}.ctrl .ok{color:var(--ok)}
.ctrl .ko:hover{border-color:var(--bad);background:var(--badbg)}.ctrl .ok:hover{border-color:var(--ok);background:var(--okbg)}
.ctrl .fl{color:var(--vec)}
.ctrl kbd{font-family:var(--mono);font-size:.7rem;font-weight:400;color:var(--muted);margin-left:6px}
@media (max-width:520px){.ctrl kbd{display:none}.ctrl button{padding:12px 8px;font-size:.92rem}}
.end{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 24px;text-align:center}
.end .big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--vec);line-height:1}
.end .big small{font-size:.45em;color:var(--muted)}
.end .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:16px}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="/"><i>p</i>profbob</a>
  <nav aria-label="Navigation du site">
    <a href="/">Accueil</a>
    <a href="/matieres/">Matières</a>
    <a href="/notes/">Notes</a>
    <a class="opt" href="/mini-ds/">Mini-DS</a>
    <a href="/contact/">Contact</a>
    <a class="srch" href="/recherche/" aria-label="Rechercher" title="Rechercher (touche /)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  </nav>
</div></header>
<div class="wrap">
  <header class="hero" style="padding-top:30px;padding-bottom:4px">
    <div class="eyebrow" id="eb">Flashcards</div>
    <h1>Flashcards</h1>
    <p class="lead">Lis la question, essaie de retrouver la formule dans ta tête, puis retourne la carte. Sois honnête : les cartes « à revoir » reviennent en priorité.</p>
  </header>

  <div class="bar0" id="chaps"></div>
  <div id="zone"></div>
  <footer class="site">Une formule fausse ou manquante ? <a href="/contact/?type=erreur&amp;page=Flashcards">Signale-la</a>.</footer>
</div>
<script src="/mini-ds/matieres.js"></script>
<script src="cartes.js"></script>
<script src="/assets/notation.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const MAT=window.MINIDS_MATIERES||[],ALL=window.FLASHCARDS||{};
  const mid=(q.get('m')&&ALL[q.get('m')])?q.get('m'):Object.keys(ALL)[0];
  const M=MAT.find(x=>x.id===mid)||{nom:mid,chapitres:[]};
  const DECK=(ALL[mid]||[]).map((c,i)=>Object.assign({i},c));
  const KEY='flash-'+mid;
  let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('eb').textContent='Flashcards · '+M.nom;
  document.title='Flashcards '+M.nom+' · profbob.fr';
  if(M.nota)document.body.dataset.notaProfil=M.nota;

  const want=(q.get('ch')||'').split(',').filter(Boolean);
  const chSel=new Set(want.length?want:(M.chapitres||[]).map(c=>c.id));
  let onlyKo=false,mix=true,list=[],pos=0,res={};

  function chips(){
    const nKo=DECK.filter(c=>chSel.has(c.ch)&&st[c.i]==='ko').length;
    document.getElementById('chaps').innerHTML=(M.chapitres||[]).map(c=>`<button class="chip" data-ch="${c.id}" aria-pressed="${chSel.has(c.id)}">${esc(c.nom)} · ${DECK.filter(d=>d.ch===c.id).length}</button>`).join('')+
      `<button class="chip alt" id="ko" aria-pressed="${onlyKo}">Seulement à revoir · ${nKo}</button><button class="chip" id="mix" aria-pressed="${mix}">Mélanger</button>`;
    document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{chSel.has(b.dataset.ch)?chSel.delete(b.dataset.ch):chSel.add(b.dataset.ch);start()});
    document.getElementById('ko').onclick=()=>{onlyKo=!onlyKo;start()};
    document.getElementById('mix').onclick=()=>{mix=!mix;start()};
  }
  function start(){
    list=DECK.filter(c=>chSel.has(c.ch)&&(!onlyKo||st[c.i]==='ko'));
    if(mix)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
    else list.sort((a,b)=>(st[b.i]==='ko')-(st[a.i]==='ko')||a.i-b.i);
    pos=0;res={};chips();show();
  }
  function chapName(id){return ((M.chapitres||[]).find(c=>c.id===id)||{}).nom||''}
  function show(){
    const z=document.getElementById('zone');
    if(!DECK.length){z.innerHTML='<p class="empty">Pas encore de flashcards pour cette matière.</p>';return}
    if(!list.length){z.innerHTML='<p class="empty">'+(onlyKo?'Aucune carte à revoir dans ces chapitres, bien joué.':'Choisis au moins un chapitre.')+'</p>';return}
    if(pos>=list.length)return end();
    const c=list[pos],done=pos;
    z.innerHTML=`<div class="meta2"><span>${pos+1} / ${list.length}</span><span class="track"><i style="width:${done/list.length*100}%"></i></span><span>${Object.values(res).filter(x=>x==='ok').length} ✓</span></div>
      <div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="Retourner la carte">
        <div class="face front"><span class="eyebrow">${esc(chapName(c.ch))}${st[c.i]==='ko'?' · à revoir':''}</span><div class="q">${esc(c.q)}</div><span class="hint">Clique ou appuie sur Espace pour retourner</span></div>
        <div class="face back"><span class="eyebrow">Réponse</span><div class="r" data-nota>${esc(c.r)}</div></div>
      </div></div>
      <div class="ctrl"><button class="ko" id="bko">À revoir<kbd>←</kbd></button><button class="fl" id="bfl">Retourner<kbd>Espace</kbd></button><button class="ok" id="bok">Je savais<kbd>→</kbd></button></div>`;
    if(window.Nota)Nota.apply(z);
    const card=document.getElementById('card');
    card.onclick=()=>card.classList.toggle('flip');
    document.getElementById('bfl').onclick=()=>card.classList.toggle('flip');
    document.getElementById('bko').onclick=()=>answer('ko');
    document.getElementById('bok').onclick=()=>answer('ok');
  }
  function answer(v){const c=list[pos];res[c.i]=v;st[c.i]=v;save();pos++;show()}
  function end(){
    const ok=Object.values(res).filter(x=>x==='ok').length,ko=list.length-ok;
    if(window.pbStat)pbStat('ev-flash');
    document.getElementById('zone').innerHTML=`<div class="end"><div class="eyebrow">Paquet terminé</div><div class="big">${ok}<small> / ${list.length}</small></div>
      <p>${ko?ko+' carte'+(ko>1?'s':'')+' à revoir.':'Tu savais tout, parfait.'}</p>
      <div class="row">${ko?'<button class="btn" id="again-ko">Revoir les '+ko+' à revoir</button>':''}<button class="btn ghost" id="again">Recommencer tout</button><a class="btn ghost" href="/mini-ds/?m=${mid}">Passer au mini-DS ▸</a></div></div>`;
    chips();
    const a=document.getElementById('again-ko');if(a)a.onclick=()=>{list=list.filter(c=>res[c.i]==='ko');pos=0;res={};show()};
    document.getElementById('again').onclick=start;
  }
  addEventListener('keydown',e=>{if(!document.getElementById('card'))return;if(e.target.closest('input,textarea'))return;
    if(e.code==='Space'){e.preventDefault();document.getElementById('card').classList.toggle('flip')}
    else if(e.key==='ArrowLeft')answer('ko');else if(e.key==='ArrowRight')answer('ok')});
  start();
})();
</script>
<script src="/assets/stats.js" defer></script>
<script src="/assets/pwa.js" defer></script>
</body>
</html>
